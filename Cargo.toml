[package]
name = "telmo"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Speech recognition on the CPU in pure Rust, in a library with no dependencies. Runs Granite Speech and Parakeet."
repository = "https://github.com/mesa-hills-research/telmo"
documentation = "https://docs.rs/telmo"
readme = "README.md"
keywords = ["speech-recognition", "speech-to-text", "asr", "transcription", "offline"]
categories = ["multimedia::audio", "science", "command-line-utilities"]
# The golden tensors and clips are for checking against the reference implementations from a
# clone of the repository. Tests that read them skip when they're absent.
exclude = ["tests/goldens/", "examples/wer/scripts/"]

[lib]
name = "telmo"

# The command downloads models over HTTPS with ureq. The library needs none of it, so it has no
# dependencies with default features off.
[[bin]]
name = "telmo"
required-features = ["download"]

[features]
default = ["download"]
download = ["dep:ureq"]

[dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }

[profile.release]
debug = "line-tables-only"

# The golden tests run the whole model, which is far too slow without optimization.
[profile.test]
opt-level = 3
debug = "line-tables-only"

# The WER example's normalizer and scorer have tests of their own.
[[example]]
name = "wer"
test = true

[[bench]]
name = "audio"
harness = false

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "rtf"
harness = false

[[bench]]
name = "weights"
harness = false

[[bench]]
name = "stream"
harness = false
